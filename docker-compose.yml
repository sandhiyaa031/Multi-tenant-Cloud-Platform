# DBPilot on one machine:
#   control plane          - control-db, migrate, api, collector, engine, web
#   data plane             - dp-primary, dp-replica, pgbouncer, dp-seed
#   experimentation plane  - twin
#
# CPU sets keep the planes off each other's cores on a single development host,
# so load in one plane does not show up as noise in another's measurements.
#
# Sizes are variables with full-size defaults. A machine with 16 GB of memory
# should set the smaller profile in .env (see "Resource profiles" in the README):
# on one host the planes share memory and disk, and a twin run that starves the
# primary of cache turns into a production incident.
name: dbpilot

services:
  # ---- Control plane ---------------------------------------------------------

  control-db:
    # An init process as PID 1. Without it PostgreSQL is PID 1, inherits orphaned
    # health-check processes, and restarts itself when one of them exits abnormally.
    init: true
    image: postgres:18
    mem_limit: 512m
    environment:
      POSTGRES_USER: dbpilot_owner
      POSTGRES_PASSWORD: ${CONTROL_DB_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: dbpilot_control
    volumes:
      - control-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dbpilot_owner -d dbpilot_control"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5440:5432"

  migrate:
    build: &controlplane_build
      context: .
      dockerfile: controlplane/Dockerfile
    command: ["python", "migrate.py"]
    environment:
      CONTROL_DB_OWNER_URL: postgresql://dbpilot_owner:${CONTROL_DB_OWNER_PASSWORD}@control-db:5432/dbpilot_control
      CONTROL_DB_API_PASSWORD: ${CONTROL_DB_API_PASSWORD:?set in .env}
      CONTROL_DB_COLLECTOR_PASSWORD: ${CONTROL_DB_COLLECTOR_PASSWORD:?set in .env}
      CONTROL_DB_ENGINE_PASSWORD: ${CONTROL_DB_ENGINE_PASSWORD:?set in .env}
    depends_on:
      control-db:
        condition: service_healthy
    restart: "no"

  api:
    build: *controlplane_build
    environment:
      CONTROL_DB_API_URL: postgresql://dbpilot_api:${CONTROL_DB_API_PASSWORD}@control-db:5432/dbpilot_control
      # Tests only: lets them assert facts the API role is forbidden to see.
      CONTROL_DB_OWNER_URL: postgresql://dbpilot_owner:${CONTROL_DB_OWNER_PASSWORD}@control-db:5432/dbpilot_control
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The LLM agent. Without a key, the rule-based proposer still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      # Tests only: the collector integration test runs inside this image.
      CONTROL_DB_COLLECTOR_URL: postgresql://dbpilot_collector:${CONTROL_DB_COLLECTOR_PASSWORD}@control-db:5432/dbpilot_control
      DP_MONITOR_PASSWORD: ${DATAPLANE_MONITOR_PASSWORD}
      DP_TENANT_PASSWORD: ${DATAPLANE_TENANT_PASSWORD}
      CONTROL_DB_ENGINE_URL: postgresql://dbpilot_engine:${CONTROL_DB_ENGINE_PASSWORD}@control-db:5432/dbpilot_control
      TWIN_URL: http://twin:8080
      TWIN_TOKEN: ${TWIN_TOKEN}
      DP_EXECUTOR_PASSWORD: ${DATAPLANE_EXECUTOR_PASSWORD}
      DP_POOLER_ADMIN_PASSWORD: ${DATAPLANE_PGBOUNCER_AUTH_PASSWORD}
    mem_limit: 384m
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  # The control-plane UI. Serves the built app and proxies /api to the API,
  # so the browser only ever talks to one origin.
  web:
    build: ./web
    mem_limit: 128m
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

  # OBSERVE: snapshots data-plane statistics into the control-plane database.
  collector:
    build: *controlplane_build
    command: ["python", "-m", "app.collector"]
    mem_limit: 384m
    environment:
      CONTROL_DB_COLLECTOR_URL: postgresql://dbpilot_collector:${CONTROL_DB_COLLECTOR_PASSWORD}@control-db:5432/dbpilot_control
      DP_MONITOR_PASSWORD: ${DATAPLANE_MONITOR_PASSWORD:?set in .env}
      COLLECT_INTERVAL_S: ${COLLECT_INTERVAL_S:-60}
      DP_LOG_DIR: /var/log/dbpilot
    volumes:
      - dp-logs:/var/log/dbpilot:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # VERIFY / CANARY: takes proposals through the tiers and applies approved ones.
  engine:
    build: *controlplane_build
    command: ["python", "-m", "app.engine"]
    mem_limit: 384m
    environment:
      CONTROL_DB_ENGINE_URL: postgresql://dbpilot_engine:${CONTROL_DB_ENGINE_PASSWORD}@control-db:5432/dbpilot_control
      TWIN_URL: http://twin:8080
      TWIN_TOKEN: ${TWIN_TOKEN}
      TWIN_WINDOW_S: ${TWIN_WINDOW_S:-120}
      TWIN_REPETITIONS: ${TWIN_REPETITIONS:-2}
      TWIN_MAX_LOOKS: ${TWIN_MAX_LOOKS:-3}
      COLLECT_INTERVAL_S: ${COLLECT_INTERVAL_S:-60}
      DP_EXECUTOR_PASSWORD: ${DATAPLANE_EXECUTOR_PASSWORD}
      DP_POOLER_ADMIN_PASSWORD: ${DATAPLANE_PGBOUNCER_AUTH_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: registers the development data plane as a demo organization.
  demo-seed:
    build: *controlplane_build
    profiles: ["seed"]
    command: ["python", "demo_seed.py"]
    environment:
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.dbpilot.dev}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set in .env}
    depends_on:
      - api

  # ---- Data plane ------------------------------------------------------------

  dp-primary:
    # An init process as PID 1. Without it PostgreSQL is PID 1, inherits orphaned
    # health-check processes, and restarts itself when one of them exits abnormally.
    init: true
    build: ./dataplane/postgres
    cpuset: "0-3"
    mem_limit: ${DP_MEM_LIMIT:-6g}
    shm_size: 512m
    environment:
      POSTGRES_PASSWORD: ${DATAPLANE_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: app
      REPLICATION_PASSWORD: ${DATAPLANE_REPLICATION_PASSWORD:?set in .env}
      PGBOUNCER_AUTH_PASSWORD: ${DATAPLANE_PGBOUNCER_AUTH_PASSWORD:?set in .env}
      MONITOR_PASSWORD: ${DATAPLANE_MONITOR_PASSWORD:?set in .env}
      EXECUTOR_PASSWORD: ${DATAPLANE_EXECUTOR_PASSWORD:?set in .env}
    command: &pg_settings
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      # Sized to hold the whole development database, so the working set stays in
      # PostgreSQL's own cache and twin copies cannot push it out of the page cache.
      - shared_buffers=${DP_SHARED_BUFFERS:-2GB}
      - -c
      - max_connections=200
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=2GB
      # Upper bound on WAL held back for a stopped standby's replication slot.
      - -c
      - max_slot_wal_keep_size=8GB
      - -c
      - max_wal_size=4GB
      - -c
      - hot_standby=on
      # Statement capture: every statement with its duration and parameters, as JSON.
      # Files are named by the minute and reused each hour; the twin node deletes
      # those older than LOG_RETENTION_MIN.
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/dbpilot
      - -c
      - log_filename=pg-%M.log
      - -c
      - log_rotation_age=10min
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_min_duration_statement=0
      - -c
      - log_file_mode=0644
    volumes:
      - dp-primary-data:/var/lib/postgresql
      - dp-logs:/var/log/dbpilot
    healthcheck:
      # -h forces TCP: during first-time initialisation the server listens on the
      # socket only, and must not be reported healthy until the real start.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:5441:5432"

  dp-replica:
    # An init process as PID 1. Without it PostgreSQL is PID 1, inherits orphaned
    # health-check processes, and restarts itself when one of them exits abnormally.
    init: true
    build: ./dataplane/postgres
    cpuset: "4-5"
    mem_limit: ${REPLICA_MEM_LIMIT:-4g}
    shm_size: 256m
    entrypoint: ["replica-entrypoint.sh"]
    command: *pg_settings
    environment:
      PRIMARY_HOST: dp-primary
      STANDBY_SHARED_BUFFERS: ${STANDBY_SHARED_BUFFERS:-256MB}
      REPLICATION_PASSWORD: ${DATAPLANE_REPLICATION_PASSWORD}
    volumes:
      - dp-replica-data:/var/lib/postgresql
    depends_on:
      dp-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:5442:5432"

  pgbouncer:
    build: ./dataplane/pgbouncer
    cpuset: "6"
    mem_limit: 128m
    environment:
      PRIMARY_HOST: dp-primary
      REPLICA_HOST: dp-replica
      PGBOUNCER_AUTH_PASSWORD: ${DATAPLANE_PGBOUNCER_AUTH_PASSWORD}
    depends_on:
      dp-primary:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:6432"

  # One-shot: provisions the four demo tenants and loads their data.
  dp-seed:
    build: ./dataplane/postgres
    entrypoint: ["psql"]
    command:
      - "postgresql://postgres:${DATAPLANE_OWNER_PASSWORD}@dp-primary:5432/app"
      - -v
      - "tenant_pw=${DATAPLANE_TENANT_PASSWORD:?set in .env}"
      - -v
      - "scale=${SEED_SCALE:-1.0}"
      - -v
      - "items=${SEED_ITEMS:-100000}"
      - -f
      - /seed/seed.sql
    volumes:
      - ./dataplane/seed:/seed:ro
    depends_on:
      dp-primary:
        condition: service_healthy
    restart: "no"

  # ---- Experimentation plane -------------------------------------------------

  # Twin node agent: a delayed standby of the primary plus ephemeral clones.
  # It has its own cores; the clone it measures is pinned to four of them, the
  # same number the primary has.
  twin:
    build:
      context: .
      dockerfile: twin/Dockerfile
    cpuset: "12-19"
    mem_limit: ${TWIN_MEM_LIMIT:-8g}
    shm_size: 512m
    environment:
      PRIMARY_HOST: dp-primary
      REPLICATION_PASSWORD: ${DATAPLANE_REPLICATION_PASSWORD}
      TWIN_TOKEN: ${TWIN_TOKEN:?set in .env}
      TWIN_DELAY_S: ${TWIN_DELAY_S:-180}
      TWIN_INSTANCE_CPUS: "12-15"
      # The clone under measurement gets the primary's cache size.
      TWIN_SHARED_BUFFERS: ${DP_SHARED_BUFFERS:-2GB}
      TWIN_SOURCE_BUFFERS: ${STANDBY_SHARED_BUFFERS:-256MB}
      DP_LOG_DIR: /var/log/dbpilot
      # Capture files older than this are deleted (0 keeps the full hour).
      LOG_RETENTION_MIN: ${LOG_RETENTION_MIN:-0}
    volumes:
      - twin-data:/twin
      - dp-logs:/var/log/dbpilot
    depends_on:
      dp-primary:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"

  # Open-loop load generator. Run with:
  #   docker compose run --rm workload --duration 120 --out /results/run.jsonl
  workload:
    build: ./workload
    profiles: ["load"]
    cpuset: "7-8"
    environment:
      DP_POOLER_HOST: pgbouncer
      DP_TENANT_PASSWORD: ${DATAPLANE_TENANT_PASSWORD}
    volumes:
      - ./results:/results
    depends_on:
      - pgbouncer

  # Evaluation harness: one scenario under one verification configuration. Run with:
  #   docker compose run --rm evaluation --scenario S1_missing_index --config C4_twin_per_tenant
  evaluation:
    build: ./workload
    profiles: ["eval"]
    cpuset: "7-8"
    entrypoint: ["python", "-m", "evaluation"]
    environment:
      API_URL: http://api:8000
      DP_POOLER_HOST: pgbouncer
      DP_TENANT_PASSWORD: ${DATAPLANE_TENANT_PASSWORD}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.dbpilot.dev}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      EVAL_WARM_S: ${EVAL_WARM_S:-150}
      # Multiplies every stream's request rate; connections per stream.
      EVAL_RATE_SCALE: ${EVAL_RATE_SCALE:-1.0}
      EVAL_POOL_SIZE: ${EVAL_POOL_SIZE:-16}
    mem_limit: 512m
    volumes:
      - ./results:/results
    depends_on:
      - pgbouncer
      - api

  # Run with: docker compose run --rm dp-test
  dp-test:
    build: *controlplane_build
    profiles: ["test"]
    working_dir: /dptests
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "/dptests"]
    environment:
      DP_OWNER_URL: postgresql://postgres:${DATAPLANE_OWNER_PASSWORD}@dp-primary:5432/app
      DP_REPLICA_OWNER_URL: postgresql://postgres:${DATAPLANE_OWNER_PASSWORD}@dp-replica:5432/app
      DP_EXECUTOR_URL: postgresql://dbpilot_executor:${DATAPLANE_EXECUTOR_PASSWORD}@dp-primary:5432/app
      PYTHONPATH: /srv
      DP_POOLER_HOST: pgbouncer
      DP_PRIMARY_HOST: dp-primary
      DP_TENANT_PASSWORD: ${DATAPLANE_TENANT_PASSWORD}
    volumes:
      - ./dataplane/tests:/dptests:ro

volumes:
  control-db-data:
  dp-primary-data:
  dp-logs:
  twin-data:
  dp-replica-data:
