<path d="M80 330 H870" stroke="#484f58" stroke-width="1.5"/>
<text x="480" y="372" fill="#8b949e" font-size="12" text-anchor="middle">how much slower one neighbouring tenant was made (the target itself got 10x faster)</text>
<text x="480" y="394" fill="#8b949e" font-size="11" text-anchor="middle">Per-tenant gate approvals: 0% in every column, the harmless one included. Real noise, synthetic effect.</text>
