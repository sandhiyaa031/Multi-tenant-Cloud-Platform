<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBPilot</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">DBPILOT</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#overview" data-page="overview" class="nav-item active">Overview</a>
      <a href="#databases" data-page="databases" class="nav-item">Databases</a>
      <a href="#query-performance" data-page="query-performance" class="nav-item">Query Performance</a>
      <a href="#alerts" data-page="alerts" class="nav-item">Alerts</a>
      <a href="#policies" data-page="policies" class="nav-item">Policies</a>
      <a href="#teams" data-page="teams" class="nav-item">Teams</a>
      <a href="#subscriptions" data-page="subscriptions" class="nav-item">Subscriptions</a>
      <a href="#companies" data-page="companies" class="nav-item">Company Management</a>
    </nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">☾ Dark</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Overview</h1>
      <div class="topbar-right">
        <span class="env-badge">dbpilot_platform</span>
        <span class="status-dot" id="conn-status" title="Backend status"></span>
        <span id="conn-status-label">checking…</span>
      </div>
    </header>

    <main class="content" id="content">
      <!-- pages render here -->
    </main>
  </div>

</div>

<!-- Slide-over detail panel (query / instance detail) -->
<div class="overlay" id="overlay"></div>
<aside class="detail-panel" id="detail-panel">
  <div class="detail-panel-header">
    <h2 id="detail-panel-title">Details</h2>
    <button class="icon-btn" id="detail-panel-close">✕</button>
  </div>
  <div class="detail-panel-body" id="detail-panel-body"></div>
</aside>

<!-- Company add/edit modal -->
<div class="overlay" id="modal-overlay"></div>
<div class="modal" id="company-modal">
  <div class="modal-header">
    <h2 id="company-modal-title">Add Company</h2>
    <button class="icon-btn" id="company-modal-close">✕</button>
  </div>
  <form id="company-form" class="modal-body">
    <input type="hidden" id="company-id-field">
    <label>Name
      <input type="text" id="company-name-field" required maxlength="200">
    </label>
    <label>Industry
      <input type="text" id="company-industry-field" maxlength="200">
    </label>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="company-form-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="company-form-submit">Save</button>
    </div>
  </form>
</div>

<!-- Toast for success/error feedback -->
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
