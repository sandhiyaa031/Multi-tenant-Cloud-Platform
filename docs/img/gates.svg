<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>What each gate decides when one neighbour is slowed by a known amount</title>
<rect width="920" height="420" rx="14" fill="#0d1117"/>
<text x="30" y="32" fill="#e6edf3" font-size="15" font-weight="600">Injected slowdown of one neighbour, 8 replay pairs (semi-synthetic)</text>
<g font-size="12" fill="#8b949e">
<rect x="560" y="20" width="12" height="12" rx="2" fill="#f0883e"/><text x="578" y="31">aggregate gate: APPROVED the change</text>
<rect x="560" y="40" width="12" height="12" rx="2" fill="#3fb950"/><text x="578" y="51">per-tenant gate: REJECTED it for harm</text>
</g>
<path d="M80 330.0 H870" stroke="#21262d" stroke-width="1"/>
<text x="72" y="334.0" fill="#8b949e" font-size="11" text-anchor="end">0%</text>
