server {
    listen 80;
    root /usr/share/nginx/html;

    # The browser talks to one origin; the API is reached through this proxy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # A diagnosis by a rate-limited model can take several minutes.
        proxy_read_timeout 900s;
    }
    # Client-side routes: serve the app for any path that is not a file.
    location / {
        try_files $uri /index.html;
    }
}
